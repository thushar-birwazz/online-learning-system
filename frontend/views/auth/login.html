<!-- Login Page -->
<div class="auth-container">
    <div class="auth-left">
        <div class="auth-brand">
            <i class="fas fa-graduation-cap"></i>
            <h1>EduSpark</h1>
            <p>Empowering Education, Inspiring Future</p>
        </div>
        <div class="auth-features">
            <div class="af-item"><i class="fas fa-video"></i><span>Interactive Video Lectures</span></div>
            <div class="af-item"><i class="fas fa-tasks"></i><span>Smart Quiz System</span></div>
            <div class="af-item"><i class="fas fa-chart-line"></i><span>Real-time Progress Tracking</span></div>
            <div class="af-item"><i class="fas fa-bell"></i><span>Instant Notifications</span></div>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-card">
            <h2>Welcome Back!</h2>
            <p class="auth-sub">Sign in to your account</p>

            <div class="alert alert-danger" ng-if="errorMsg" ng-bind="errorMsg"></div>

            <form ng-submit="login()">
                <div class="form-group">
                    <label><i class="fas fa-envelope me-2"></i>Email Address</label>
                    <input type="email" class="form-control" ng-model="loginData.email" placeholder="you@example.com"
                        required>
                </div>
                <div class="form-group mt-3">
                    <label><i class="fas fa-lock me-2"></i>Password</label>
                    <input type="password" class="form-control" ng-model="loginData.password" placeholder="••••••••"
                        required>
                </div>
                <button type="submit" class="btn btn-primary-grad w-100 mt-4" ng-disabled="loading">
                    <span ng-if="!loading"><i class="fas fa-sign-in-alt me-2"></i>Sign In</span>
                    <span ng-if="loading"><i class="fas fa-spinner fa-spin me-2"></i>Signing in...</span>
                </button>
            </form>

            <p class="auth-switch mt-4">Don't have an account? <a href="#/register">Create one free</a></p>
        </div>
    </div>
</div>
