<!-- Student Announcements -->
<div class="page-container" ng-controller="StudentAnnouncementController">
    <div class="page-hero student-hero">
        <div class="hero-content">
            <h1><i class="fas fa-newspaper me-2"></i>Announcements</h1>
            <p>Stay updated with messages from your teachers</p>
        </div>
    </div>

    <div class="alert alert-success" ng-if="message">{{message}}</div>
    <div ng-if="loading" class="text-center py-5"><i class="fas fa-spinner fa-spin fa-3x text-primary"></i></div>

    <div ng-if="!loading && !announcements.length" class="empty-state">
        <i class="fas fa-newspaper fa-3x mb-3"></i>
        <h4>No announcements yet</h4>
    </div>

    <div class="section mt-2" ng-if="!loading">
        <div class="announcement-card" ng-repeat="a in announcements">
            <div class="announcement-header">
                <div class="annc-icon student-annc"><i class="fas fa-bullhorn"></i></div>
                <div class="annc-meta">
                    <h4>{{a.title}}</h4>
                    <p>
                        <i class="fas fa-user me-1"></i>{{a.teacherName}} &nbsp;•&nbsp;
                        <i class="fas fa-book me-1"></i>{{a.courseName}} &nbsp;•&nbsp;
                        {{a.createdAt | date:'MMM d, y'}}
                    </p>
                </div>
            </div>
            <p class="annc-body">{{a.body}}</p>


        </div>
    </div>
</div>
