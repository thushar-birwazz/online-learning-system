<!DOCTYPE html>
<html lang="en" ng-app="lmsApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduSpark - Premium Online Learning Management System for Teachers and Students">
  <title>EduSpark | Online Learning System</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar" ng-controller="NavController">
    <div class="container-fluid px-4">
      <a class="navbar-brand brand-logo" href="#/">
        <i class="fas fa-graduation-cap"></i>
        <span>Edu<strong>Spark</strong></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <i class="fas fa-bars text-white"></i>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <!-- Teacher Nav -->
        <ul class="navbar-nav ms-auto align-items-center" ng-if="isLoggedIn() && user.role === 'teacher'">
          <li class="nav-item"><a class="nav-link" href="#/teacher/dashboard"><i class="fas fa-home me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#/teacher/courses"><i class="fas fa-book me-1"></i>Courses</a></li>
          <li class="nav-item"><a class="nav-link" href="#/teacher/quizzes"><i class="fas fa-question-circle me-1"></i>Quizzes</a></li>
          <li class="nav-item"><a class="nav-link" href="#/teacher/progress"><i class="fas fa-chart-bar me-1"></i>Progress</a></li>
          <li class="nav-item"><a class="nav-link" href="#/teacher/announcements"><i class="fas fa-bullhorn me-1"></i>Announcements</a></li>
          <li class="nav-item ms-2">
            <div class="user-avatar-dropdown dropdown">
              <button class="btn user-btn dropdown-toggle" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>{{user.name}}
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><span class="dropdown-item-text text-muted small">{{user.email}}</span></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" ng-click="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
              </ul>
            </div>
          </li>
        </ul>

        <!-- Student Nav -->
        <ul class="navbar-nav ms-auto align-items-center" ng-if="isLoggedIn() && user.role === 'student'">
          <li class="nav-item"><a class="nav-link" href="#/student/dashboard"><i class="fas fa-home me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#/student/courses"><i class="fas fa-book me-1"></i>Courses</a></li>
          <li class="nav-item"><a class="nav-link" href="#/student/progress"><i class="fas fa-chart-line me-1"></i>Progress</a></li>
          <li class="nav-item">
            <a class="nav-link position-relative" href="#/student/notifications">
              <i class="fas fa-bell me-1"></i>Alerts
              <span class="notif-badge" ng-if="unreadCount > 0">{{unreadCount}}</span>
            </a>
          </li>
          <li class="nav-item"><a class="nav-link" href="#/student/announcements"><i class="fas fa-newspaper me-1"></i>News</a></li>
          <li class="nav-item ms-2">
            <div class="dropdown">
              <button class="btn user-btn dropdown-toggle" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>{{user.name}}
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><span class="dropdown-item-text text-muted small">{{user.email}}</span></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" ng-click="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
              </ul>
            </div>
          </li>
        </ul>

        <!-- Guest Nav -->
        <ul class="navbar-nav ms-auto" ng-if="!isLoggedIn()">
          <li class="nav-item"><a class="nav-link" href="#/login">Login</a></li>
          <li class="nav-item ms-2"><a class="btn btn-primary-grad" href="#/register">Get Started</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div ng-view></div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AngularJS -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>

  <!-- App -->
  <script src="js/app.js"></script>

  <!-- Services -->
  <script src="js/services/AuthService.js"></script>
  <script src="js/services/CourseService.js"></script>
  <script src="js/services/QuizService.js"></script>
  <script src="js/services/NotificationService.js"></script>

  <!-- Controllers -->
  <script src="js/controllers/NavController.js"></script>
  <script src="js/controllers/AuthController.js"></script>
  <script src="js/controllers/teacher/DashboardController.js"></script>
  <script src="js/controllers/teacher/CourseController.js"></script>
  <script src="js/controllers/teacher/QuizController.js"></script>
  <script src="js/controllers/teacher/ProgressController.js"></script>
  <script src="js/controllers/teacher/AnnouncementController.js"></script>
  <script src="js/controllers/student/DashboardController.js"></script>
  <script src="js/controllers/student/CourseController.js"></script>
  <script src="js/controllers/student/LessonController.js"></script>
  <script src="js/controllers/student/QuizController.js"></script>
  <script src="js/controllers/student/ProgressController.js"></script>
  <script src="js/controllers/student/NotificationController.js"></script>
  <script src="js/controllers/student/AnnouncementController.js"></script>
</body>
</html>
